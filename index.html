<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>가위바위보 포즈 게임</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <h1>🎮 가위바위보 포즈 게임</h1>

  <div class="button-container">
    <button type="button" id="startBtn" onclick="init()">게임 시작</button>
    <button type="button" id="stopBtn" onclick="stop()" disabled>게임 중지</button>
  </div>

  <!-- Game Phase Display -->
  <div id="game-phase"></div>

  <!-- Main Game Area -->
  <div class="game-container">
    <!-- Player Side -->
    <div class="player-side">
      <h2>플레이어</h2>
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="max-prediction"></div>
      </div>
      <div id="player-choice" class="choice-display-small"></div>
    </div>

    <!-- VS Divider -->
    <div class="vs-divider">VS</div>

    <!-- Computer Side -->
    <div class="computer-side">
      <h2>컴퓨터</h2>
      <div id="computer-choice" class="choice-display-large">?</div>
    </div>
  </div>

  <!-- Result Display -->
  <div id="result-display"></div>

  <!-- Score Display (moved to bottom) -->
  <div id="score-board">
    <div class="score-item">
      <span class="score-label">승리</span>
      <span class="score-value" id="wins">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">무승부</span>
      <span class="score-value" id="draws">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">패배</span>
      <span class="score-value" id="losses">0</span>
    </div>
  </div>

  <!-- Debug: Label Container (hidden by default) -->
  <div id="label-container" style="display: none;"></div>

  <!-- Teachable Machine 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <!-- 애플리케이션 모듈 -->
  <script src="./js/stabilizer.js"></script>
  <script src="./js/imageEngine.js"></script>
  <script src="./js/gameEngine.js"></script>
  <script src="./js/main.js"></script>
</body>

</html>
